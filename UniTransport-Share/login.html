<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Iniciar sesión | UniTransport</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-body">
<div class="auth-card">
  <a class="logo auth-logo" href="index.html">🚗 UniTransport <span>Share</span></a>
  <div class="auth-icon">🔐</div>
  <h1>Iniciar sesión</h1>
  <p class="muted">Ingresa con tu cuenta universitaria.</p>
  <form id="loginForm">
    <label>Correo institucional</label><input type="email" placeholder="ejemplo@universidad.edu.pe" required>
    <label>Contraseña</label><input type="password" placeholder="••••••••" required>
    <div class="form-row between"><label class="check"><input type="checkbox"> Recordarme</label><a href="#">¿Olvidaste tu contraseña?</a></div>
    <button class="btn full" type="submit">Ingresar</button>
  </form>
  <p class="auth-bottom">¿No tienes una cuenta? <a href="registro.html">Crear cuenta</a></p>
  <a class="back-link" href="index.html">← Volver al inicio</a>
</div>
<script src="js/script.js"></script>
</body>
</html>
