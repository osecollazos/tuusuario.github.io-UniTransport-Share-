<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Crear viaje | UniTransport</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header><a class="logo" href="conductor.html">🚗 UniTransport <span>Share</span></a><nav><a href="conductor.html">Panel</a><a href="crear-viaje.html">Crear viaje</a><a href="pasajeros.html">Pasajeros</a><a href="ganancias.html">Ganancias</a></nav></header>
<main class="page-container">
<div class="page-title"><span class="eyebrow">Conductor</span><h1>Publicar un viaje</h1><p>Indica los detalles de tu ruta.</p></div>
<form class="search-panel" id="createTripForm"><div class="form-grid"><div><label>Origen</label><input required placeholder="Punto de partida"></div><div><label>Destino</label><input required value="Universidad Continental"></div><div><label>Fecha</label><input type="date" required></div><div><label>Hora de salida</label><input type="time" required></div><div><label>Capacidad</label><select><option>4 pasajeros</option><option selected>5 pasajeros</option><option>6 pasajeros</option></select></div><div><label>Precio por pasajero</label><input type="number" value="3.50" step="0.10"></div></div><div class="smart-message">🤖 La aplicación buscará automáticamente pasajeros con rutas compatibles.</div><button class="btn" type="submit">🚗 Publicar viaje</button></form>
</main>
<script src="js/script.js"></script>
</body>
</html>
