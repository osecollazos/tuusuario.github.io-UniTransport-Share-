<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Seguimiento | UniTransport</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header><a class="logo" href="estudiante.html">🚗 UniTransport <span>Share</span></a><nav><a href="estudiante.html">Inicio</a><a href="mis-viajes.html">Mis viajes</a><a href="mis-viajes.html">Mis viajes</a></nav></header>
<main class="tracking">
  <section class="fake-map">
    <div class="map-grid"></div><div class="road road-a"></div><div class="road road-b"></div><div class="route-line track-route"></div>
    <div class="map-pin pin-track-home">🏠</div><div class="map-pin pin-track-1">👨‍🎓</div><div class="map-pin pin-track-2">👩‍🎓</div><div class="map-pin pin-track-uni">🏫</div><div class="map-car moving">🚗</div>
    <div class="map-control">＋<br><hr>−</div>
  </section>
  <aside class="tracking-panel">
    <span class="eyebrow">Viaje activo</span><h1>Conductor en camino 🚗</h1>
    <div class="eta"><span>⏱️</span><div><small>Llegará aproximadamente en</small><strong>8 minutos</strong></div></div>
    <div class="progress"><div style="width:62%"></div></div>
    <div class="track-status"><b>Pasajeros recogidos</b><strong>3/5</strong></div>
    <div class="next-stop"><span>📍</span><div><small>Próxima parada</small><b>Av. Ferrocarril 123</b></div></div>
    <div class="trip-driver"><div class="driver-photo">👨‍🚗</div><div><b>Carlos Mendoza</b><small>★ 4.9 · Toyota Yaris</small></div></div>
    <button class="emergency">🚨 Botón de emergencia</button>
    <a class="btn full center" href="mis-viajes.html">Finalizar seguimiento</a>
  </aside>
</main>
</body>
</html>
